name: CI & Deploy

# Runs the full gate on every push and PR; deploys the built dist/ to GitHub Pages on main.
# This is the single automated check the repo was missing - nothing ran typecheck/lint/test/build
# before - and it doubles as the Pages deploy so the site root serves the BUILT app, not the dev
# index.html that pointed at /src/main.tsx.
on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job elevates what it needs.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage # runs the tests and enforces the coverage thresholds
      - run: npm run build
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
